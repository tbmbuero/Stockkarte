name: Build TWRP SM-T395
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libncurses6 lib32ncurses6 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 locales repo
          sudo locale-gen en_US.UTF-8
          for f in $(find /lib /usr/lib -name "libtinfo.so.6" 2>/dev/null); do sudo ln -sf "$f" "${f%.6}.5"; done
          for f in $(find /lib /usr/lib -name "libncurses.so.6" 2>/dev/null); do sudo ln -sf "$f" "${f%.6}.5"; done
          sudo ldconfig
      - name: Sync TWRP Source & Device Tree
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          git config --global user.email "user@example.com"
          git config --global user.name "User"
          git config --global color.ui false
          H="github.com"
          repo init --depth=1 -u "https://$H/minimal-manifest-twrp/platform_manifest_twrp_omni.git" -b twrp-9.0
          repo sync -c --no-clone-bundle --no-tags -j$(nproc)
          git clone -b android17-layout "https://$H/qcom-toolbox/TWRP_GTA2LTE.git" device/samsung/gtactive2lte

      - name: Apply Patches
        run: |
          cd ~/twrp
          patch -d build/make -p1 < device/samsung/gtactive2lte/patches/build_make.patch
          patch -d bootable/recovery -p1 < device/samsung/gtactive2lte/patches/bootable_recovery.patch
          patch -d frameworks/base -p1 < device/samsung/gtactive2lte/patches/frameworks_base.patch
          patch -d external/clang -p1 < device/samsung/gtactive2lte/patches/external_clang.patch
          patch -d art -p1 < device/samsung/gtactive2lte/patches/art.patch
          patch -d system/sepolicy -p1 < device/samsung/gtactive2lte/patches/system_sepolicy.patch
          patch -d system/core -p1 < device/samsung/gtactive2lte/patches/system_core.patch

      - name: Build Recovery Image
        run: |
          cd ~/twrp
          export USE_CCACHE=0
          export LC_ALL=C.UTF-8
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_gtactive2lte-userdebug
          mka recoveryimage
          printf 'SEANDROIDENFORCE' >> out/target/product/gtactive2lte/recovery.img
          cp out/target/product/gtactive2lte/recovery.img ~/twrp_sm-t395.img

      - name: Upload TWRP Image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-sm-t395
          path: ~/twrp_sm-t395.img
